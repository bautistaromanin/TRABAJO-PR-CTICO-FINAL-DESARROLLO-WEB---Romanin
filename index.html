            container.innerHTML = '';
            
            const filteredData = categoryFilter === 'all'

                : linesData.filter(item => item.category === categoryFilter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "line-card bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-xl flex items-start gap-4";
                
                const paddedId = String(item.id).padStart(2, '0');
                
                card.innerHTML = `

            // Update status text and progress bar
            showingCount.textContent = `Mostrando ${filteredData.length} de 67 líneas`;
            const percentage = (filteredData.length / 67) * 100;
            progressBar.style.width = `${percentage}%`;

        function filterLines(category) {
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'active');
                btn.classList.add('bg-slate-800', 'text-slate-300');
